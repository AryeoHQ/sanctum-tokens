# Validates aryeo/sanctum-tokens and publishes it to the Artifactory Composer repository.
#
# aryeo/sanctum-tokens is AryeoHQ's fork of jeffbeltran/sanctum-tokens, kept for Nova 5
# support (upstream supports Nova 4 only). It replaces jeffbeltran/sanctum-tokens, so
# requiring it satisfies packages that still require the upstream name.
#
# The package has no test suite, and installing it needs Laravel Nova credentials, so branches
# only validate composer.json. A semver tag push (e.g. 1.0.1) then packages the tagged source,
# including the compiled assets in dist/, and publishes it.
#
# The job scripts come from the shared template.
include:
  - project: vendor-platform/ci_cd/gitlab-ci-templates
    ref: main
    file: php-composer-package.yml

stages:
  - test
  - package
  - publish

default:
  tags:
    - build
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Runs without installing dependencies, which would need Nova credentials. A job without
# rules is left out of merge request pipelines, so list every pipeline it should run in.
validate:
  stage: test
  image: $PHP_IMAGE
  script:
    - composer validate --strict --no-check-lock
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

package:
  stage: package
  extends: .package
  needs: [validate]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/

publish:
  stage: publish
  extends: .publish
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
